# athome — example configuration
# Place this file at: ~/.config/athome/config.toml

[profiles]
# Simple form: just a source URL.
work     = "https://github.com/your-org/dotfiles-work"
# Rich form: custom local destination for chezmoi source files.
personal = {source = "https://github.com/your-user/dotfiles-personal", destination = "~/.dotfiles"}

[templates]
python = "https://github.com/Dev-Oc-Collectif/python-template"
zola   = "https://github.com/Dev-Oc-Collectif/zola-template"

[git]
workspace = "~/workspace"   # default clone destination for all providers

[git.owners.gh]
org      = "https://github.com/your-org"
personal = "https://github.com/your-user"

[git.repositories.gh]
dotfiles = "https://github.com/your-user/dotfiles"

# [managers]
# Override or extend auto-discovered git managers.
# gh     = "athome.git_managers.gh:GhManager"   # override built-in
# gitlab = "athome_gitlab:GitLabManager"          # add third-party plugin
